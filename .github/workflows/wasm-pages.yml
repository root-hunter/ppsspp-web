name: Build WASM release and publish Pages

on:
  push:
    branches:
      - wasm
  pull_request:
    branches:
      - wasm
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PPSSPP Web
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.12

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/deps/ppsspp-wasm"

      - name: Verify pinned PPSSPP WASM revision
        shell: bash
        run: |
          expected="$(git ls-tree HEAD deps/ppsspp-wasm | awk '{print $3}')"
          actual="$(git -C deps/ppsspp-wasm rev-parse HEAD)"
          test -n "$expected" && test "$actual" = "$expected"
          echo "Building pinned PPSSPP WASM revision $actual"

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build ca-certificates

      - name: Build release
        run: make wasm-release CMAKE=/usr/bin/cmake WASM_JOBS="-j$(nproc)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: wasm-page/package-lock.json

      - name: Install npm
        run: npm install --global npm@12.2.0

      - name: Install Angular dependencies
        run: npm --prefix wasm-page ci

      - name: Test browser runtime
        run: npm --prefix wasm-page test

      - name: Build static Pages artifact
        run: make app-build-pages

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: wasm-page/dist/ppsspp-web

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
